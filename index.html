<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Monitor</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="dashboard-header">
            <h1><i class="fas fa-tachometer-alt"></i> System Monitor</h1>
            <div class="health-score">
                <span>System Health:</span>
                <div id="health-score" class="score">100</div>
            </div>
        </header>

        <!-- Alerts Section -->
        <section class="alerts-section">
            <h2><i class="fas fa-exclamation-triangle"></i> Active Alerts</h2>
            <div id="alerts-container" class="alerts-container">
                <!-- Alerts will be populated here -->
            </div>
        </section>

        <!-- System Overview -->
        <section class="system-overview">
            <div class="stat-card">
                <h3><i class="fas fa-microchip"></i> CPU Usage</h3>
                <div class="stat-value" id="cpu-usage">0%</div>
            </div>
            <div class="stat-card">
                <h3><i class="fas fa-memory"></i> Memory Usage</h3>
                <div class="stat-value" id="memory-usage">0%</div>
            </div>
            <div class="stat-card">
                <h3><i class="fas fa-hdd"></i> Disk Usage</h3>
                <div class="stat-value" id="disk-usage">0%</div>
            </div>
        </section>

        <!-- Charts Section -->
        <section class="charts-section">
            <div class="chart-container">
                <h3><i class="fas fa-microchip"></i> CPU Usage</h3>
                <div class="chart-wrapper">
                    <canvas id="cpuChart"></canvas>
                </div>
            </div>
            <div class="chart-container">
                <h3><i class="fas fa-memory"></i> Memory Usage</h3>
                <div class="chart-wrapper">
                    <canvas id="memoryChart"></canvas>
                </div>
            </div>
            <div class="chart-container">
                <h3><i class="fas fa-hdd"></i> Disk Usage</h3>
                <div class="chart-wrapper">
                    <canvas id="diskChart"></canvas>
                </div>
            </div>
        </section>

        <!-- Process Table -->
        <section class="process-section">
            <h2><i class="fas fa-list"></i> Top Processes</h2>
            <div class="table-container">
                <table class="process-table">
                    <thead>
                        <tr>
                            <th>PID</th>
                            <th>Process Name</th>
                            <th>CPU %</th>
                            <th>Memory %</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="process-table">
                        <!-- Process data will be populated here -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Alert History -->
        <section class="alert-history">
            <h2><i class="fas fa-history"></i> Alert History</h2>
            <div id="alert-history" class="alert-history-container">
                <!-- Alert history will be populated here -->
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
